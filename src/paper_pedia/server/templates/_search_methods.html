<fieldset class="search-methods"><legend>Search method</legend>{% for value, label in [('dense', 'Dense (CLIP)'), ('splade', 'Neural sparse (SPLADE)'), ('sparse', 'Sparse (TF-IDF)'), ('subset', 'Subset (Jaccard)')] %}<label><input type="radio" name="mode" value="{{ value }}" {{ 'checked' if mode|default('sparse') == value else '' }}>{{ label }}</label>{% endfor %}</fieldset>
